<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValueBet Pro | Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
    <div class="login-container glass-panel">
        <div class="logo-box">
            <h1>ValueBet <span>Pro</span></h1>
            <p>Sistema de Análisis Estadístico</p>
        </div>
        
        <form id="loginForm" class="auth-form">
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <div id="errorMessage" class="error-msg hidden">Credenciales incorrectas</div>
            <button type="submit" class="btn-primary">Ingresar al Sistema</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('vb_token', data.token);
                    window.location.href = '/dashboard';
                } else {
                    errorMsg.textContent = data.error || "Error al iniciar sesión";
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = "Error de conexión";
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
