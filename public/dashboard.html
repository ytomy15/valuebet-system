<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValueBet Pro | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-body">
    <nav class="navbar glass-panel">
        <div class="nav-brand">ValueBet <span>Pro</span></div>
        <button id="logoutBtn" class="btn-logout">Cerrar Sesión</button>
    </nav>

    <main class="dashboard-container">
        <!-- Panel de Control -->
        <section class="control-panel glass-panel">
            <h2>Analizar Nuevo Partido</h2>
            <form id="analyzeForm" class="analyze-form">
                <div class="input-row">
                    <div class="input-group flex-2">
                        <label for="teamHome">Equipo Local</label>
                        <input type="text" id="teamHome" placeholder="Ej: Guaraní" required>
                    </div>
                    <div class="input-group flex-2">
                        <label for="teamAway">Equipo Visitante</label>
                        <input type="text" id="teamAway" placeholder="Ej: Rubio Ñu" required>
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group flex-2">
                        <label for="oddsImage">Captura de Pantalla (Cuotas)</label>
                        <input type="file" id="oddsImage" accept="image/*" multiple required>
                    </div>
                    <div class="input-group flex-1">
                        <label for="minOdds">Filtro Cuota Mínima</label>
                        <input type="number" id="minOdds" step="0.01" min="1.01" value="1.30" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="analyzeBtn">
                    <span class="btn-text">Iniciar Análisis Completo</span>
                    <div class="loader hidden"></div>
                </button>
                <div id="progressContainer" class="hidden" style="margin-top: 15px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                        <span id="progressText" style="font-size: 0.9em; font-weight: 600;">Analizando imágenes...</span>
                        <span id="progressPercent" style="font-size: 0.9em; font-weight: 600;">0%</span>
                    </div>
                    <div style="width: 100%; background-color: rgba(255, 255, 255, 0.1); border-radius: 8px; height: 10px; overflow: hidden;">
                        <div id="progressBar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #4F46E5, #0ea5e9); transition: width 0.3s ease;"></div>
                    </div>
                </div>
            </form>
        </section>

        <!-- Resultados -->
        <section class="results-panel">
            <h3>Apuestas Recomendadas (Valor Encontrado)</h3>
            <div id="resultsGrid" class="results-grid">
                <!-- Tarjetas de resultados inyectadas por JS -->
                <div class="empty-state">
                    <p>Ingresa una URL para comenzar el análisis.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
